# Lint the Dockerfile that builds Dragonfly's web image.
# Developers can use the reported line numbers and rule IDs during review.
name: Lint Dockerfile with Hadolint

on:
  # Run before merge. Each run lints the entire named Dockerfile.
  pull_request: {}

  # Let maintainers rerun the lint check from the Actions tab.
  workflow_dispatch: {}

  # Check the Dockerfile again after changes reach development.
  push:
    branches:
      - development

# Checkout needs repository read access. Lint output goes to the run log.
permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dragonfly web Dockerfile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        # Pin actions to reviewed commits. Dependabot can propose updates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The linter only needs files from the checkout.
          persist-credentials: false

      - name: Lint the web Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          # This is the Dockerfile used to build the www image.
          dockerfile: .build/www/Dockerfile

          # Print readable findings with the location, rule ID, and message.
          format: tty

          # Report findings during rollout. To enforce errors later,
          # set no-fail to false and failure-threshold to error.
          no-fail: true