# Dragonfly container release workflow
#
# Follow the image through three stages.
#   1. Build it and load it into the runner's local Docker engine.
#   2. Scan that local image and retain the report.
#   3. Publish the same image under a versioned tag and the moving www tag.
name: Build, Scan, and Push Image to DockerHub

# A push to main starts a release. Merging a pull request into main
# produces a push event. Configure required reviews and checks separately
# in the repository's branch protection rules.
on:
  push:
    branches:
      - main

# These permissions apply to GitHub's automatically issued GITHUB_TOKEN.
# Checkout needs read access to the repository. Docker Hub uses separate
# credentials, and saving a SARIF artifact needs no code-scanning permission.
permissions:
  contents: read

# Runs in this repository that use this group cannot publish concurrently.
# Let the active run finish. GitHub can replace an older pending run with a
# newer one, so this group does not guarantee a release for every push.
concurrency:
  group: dragonfly-dockerhub-publish
  cancel-in-progress: false

# Workflow-level environment values are available to every step.
# Keep the Docker Hub repository name in one place so the build, scan,
# and publish steps all use the same image name.
env:
  IMAGE_REPOSITORY: webpwnized/dragonfly

jobs:
  docker-build:
    name: Build, scan, and publish web image
    runs-on: ubuntu-latest

    # Steps in one job share the runner's workspace and Docker engine.
    # The image created by docker build remains available to later steps.
    # By default, a step runs only if preceding steps succeeded.
    steps:
      - name: Checkout code
        # Pin actions to full commit SHAs so a moved release tag cannot
        # silently change the code that runs. The version comment makes
        # the pin readable. Dependabot can propose updates to the SHA.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The job reads the checkout and never pushes back to GitHub.
          # Keep checkout credentials out of the local Git configuration.
          persist-credentials: false

      - name: Read and validate image version
        shell: bash
        run: |
          # Read the release suffix from the version file at the repo root.
          # Bash command substitution removes trailing newlines.
          version=$(<version)

          # A Docker tag can be up to 128 characters. Reserve four for the
          # "www-" prefix and allow 1 to 124 characters in the suffix.
          # The character allowlist also prevents embedded newlines from
          # creating extra entries when we write to GITHUB_ENV.
          if [[ ! "$version" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,123}$ ]]; then
            echo "::error file=version::Expected a Docker tag suffix of 1 to 124 characters."
            exit 1
          fi

          # GITHUB_ENV is a runner-provided file. Writing to it makes
          # VERSION available as an environment variable in later steps.
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Build web image
        shell: bash
        run: |
          # --file selects the Dockerfile. The final dot is the build
          # context, which determines what local files Docker can access.
          # This creates a local image tagged www. Publishing happens
          # after Trivy has scanned it.
          docker build \
            --file .build/www/Dockerfile \
            --tag "${IMAGE_REPOSITORY}:www" \
            .

      - name: Scan web image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          # Action inputs use GitHub expression syntax. Bash steps use
          # shell variables such as ${IMAGE_REPOSITORY}.
          image-ref: ${{ env.IMAGE_REPOSITORY }}:www

          # SARIF is a machine-readable format for scanner findings.
          format: sarif
          output: www-trivy-scan-results.sarif

          # Findings are report-only. An execution error that fails the
          # scan step still prevents the workflow from publishing.
          exit-code: '0'

      - name: Save Trivy report
        # An explicit condition lets this step save an existing report
        # after a failed scan. A canceled run skips the upload.
        if: ${{ !cancelled() && hashFiles('www-trivy-scan-results.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Download this report from the GitHub Actions run summary.
          # It is a workflow artifact, not a Code Scanning alert upload.
          name: www-trivy-scan-results
          path: www-trivy-scan-results.sarif
          if-no-files-found: error

      - name: Log in to Docker Hub
        # The build and scan steps run before registry login. Give the
        # publishing token only the permissions needed to push this image.
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish scanned image
        shell: bash
        run: |
          image="${IMAGE_REPOSITORY}:www"
          versioned_image="${IMAGE_REPOSITORY}:www-${VERSION}"

          # A tag is another name for an image. This command creates a
          # second name for the scanned image without rebuilding it.
          docker tag "$image" "$versioned_image"

          # Push the versioned tag first. If it fails, the Bash step exits
          # before attempting to update www. The two pushes are separate,
          # so a failed www push can leave the versioned tag published.
          docker push "$versioned_image"
          docker push "$image"