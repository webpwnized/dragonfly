# Scan the Dockerfile that builds Dragonfly's web image.
# This checks the build configuration before any image is built.
name: Scan Dockerfile Misconfigurations with Trivy

on:
  # Review the current Dockerfile as part of pull request checks.
  # Each run scans the whole file, including unchanged lines.
  pull_request: {}

  # Refresh the branch's findings after changes reach development.
  push:
    branches:
      - development

jobs:
  trivy-config:
    name: Scan Dragonfly web Dockerfile
    runs-on: ubuntu-latest

    permissions:
      # Checkout reads the repository. Code Scanning accepts SARIF uploads.
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        # Pin actions to reviewed commits. Dependabot can propose updates.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later steps only need the checked-out files.
          persist-credentials: false

      - name: Verify the Dockerfile exists
        shell: bash
        run: |
          # Fail with a clear message if the Dockerfile moves.
          if [[ ! -f .build/www/Dockerfile ]]; then
            echo "::error::Expected Dockerfile at .build/www/Dockerfile"
            exit 1
          fi

      - name: Scan the Dockerfile with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Config mode checks infrastructure and build definitions.
          # Scan the same Dockerfile used to build the www image.
          scan-type: config
          scan-ref: .build/www/Dockerfile
          format: sarif
          output: dockerfile-trivy-scan-results.sarif
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'

          # Findings are report-only. A scanner execution failure still
          # fails the step and prevents publication to Code Scanning.
          exit-code: '0'

      - name: Verify the scan produced a report
        shell: bash
        run: |
          # A successful scan should produce SARIF even with zero findings.
          if [[ ! -s dockerfile-trivy-scan-results.sarif ]]; then
            echo "::error::Trivy did not produce a nonempty SARIF report."
            exit 1
          fi

      - name: Save the Trivy report
        # Preserve any generated report for troubleshooting or PR review.
        if: ${{ !cancelled() && hashFiles('dockerfile-trivy-scan-results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dockerfile-trivy-scan-results
          path: dockerfile-trivy-scan-results.sarif
          if-no-files-found: error

      - name: Publish findings to GitHub Code Scanning
        # Fork and Dependabot PRs still run the scan and retain the report.
        # This workflow limits dashboard uploads to the cases below.
        if: >-
          ${{
            success() &&
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: dockerfile-trivy-scan-results.sarif
          # Keep this category stable so GitHub can track findings over time.
          category: Trivy Dockerfile Misconfigurations