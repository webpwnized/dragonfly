# Scan Dragonfly's application source with Semgrep Community Edition.
name: Scan Application Code with Semgrep SAST

on:
  # Analyze changes before merge. The scan uses the PR base commit to
  # report findings introduced by the proposed changes.
  pull_request: {}

  # Allow a full scan on demand from the Actions tab.
  workflow_dispatch: {}

  # Refresh full-branch results after changes reach development.
  push:
    branches:
      - development

jobs:
  semgrep:
    name: Scan application source with Semgrep
    runs-on: ubuntu-latest

    permissions:
      # Read the repository and publish SARIF to GitHub Code Scanning.
      contents: read
      security-events: write

    # Keep the Semgrep container from the original workflow.
    container:
      image: returntocorp/semgrep

    steps:
      - name: Checkout source code
        # Pin actions by commit. The version comment helps reviewers
        # identify the release when Dependabot proposes an update.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The default PR checkout is GitHub's test merge commit.
          # Fetch history so Semgrep can resolve the PR base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Dragonfly application source
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Run both packs together and produce a single SARIF report.
          # p/ci is the general security baseline. p/php adds targeted
          # coverage for the PHP code that processes requests and renders HTML.
          scan_args=(
            --config p/ci
            --config p/php
            --metrics=off
            --sarif-output semgrep-results.sarif
          )

          # Push and manual events leave PR_BASE_SHA empty and scan the
          # full application tree. PRs compare against their base commit.
          if [[ -n "$PR_BASE_SHA" ]]; then
            scan_args+=(--baseline-commit "$PR_BASE_SHA")
          fi

          # Semgrep writes readable findings to the log and SARIF to disk.
          # Findings are report-only. A nonzero scanner exit still fails
          # the step, and a missing or empty report also fails the step.
          semgrep scan "${scan_args[@]}" src
          test -s semgrep-results.sarif

      - name: Save Semgrep report
        # Keep any report produced before a failure for troubleshooting.
        # This also gives fork and Dependabot PRs a downloadable report.
        if: ${{ !cancelled() && hashFiles('semgrep-results.sarif') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          if-no-files-found: error

      - name: Publish findings to GitHub Code Scanning
        # Fork and Dependabot PRs still run the scan and save the report.
        # This workflow limits SARIF uploads to the cases below.
        if: >-
          ${{
            success() &&
            github.actor != 'dependabot[bot]' &&
            (
              github.event_name != 'pull_request' ||
              github.event.pull_request.head.repo.full_name == github.repository
            )
          }}
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: semgrep-results.sarif
          # Keep one stable category for the combined scan.
          category: Semgrep Application SAST