# Analyze Dragonfly's JavaScript and TypeScript with GitHub CodeQL.
name: Scan JavaScript with CodeQL

# A push to development starts a scan after the code reaches that branch.
# This includes a pull request merge that updates development.
on:
  push:
    branches:
      - development

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest

    # These permissions apply to the job's GITHUB_TOKEN.
    permissions:
      # Read repository and Actions metadata used by CodeQL.
      actions: read
      # Read the source checkout.
      contents: read
      # Upload findings to GitHub Code Scanning.
      security-events: write

    steps:
      - name: Checkout source code
        # Pin the action to a commit. The release comment makes the pin
        # readable, and Dependabot can propose updates to it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job reads the checkout and does not push Git changes.
          persist-credentials: false

      - name: Initialize CodeQL
        # Use the same CodeQL release for initialization and analysis.
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          # One analyzer covers both JavaScript and TypeScript. A matrix
          # becomes useful when separate analyzer jobs are needed.
          languages: javascript-typescript

          # CodeQL can read these source files directly. The scan needs
          # no npm install, application build, or running container.
          build-mode: none

      - name: Run CodeQL analysis and upload findings
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          # Keep the existing category so GitHub can associate results
          # with the same analysis when scanning the same ref.
          category: Scan-JavaScript-code-with-CodeQL