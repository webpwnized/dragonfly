# Build and start Dragonfly, then verify that the home page is reachable.
name: Verify Dragonfly Container Startup

on:
  # Test the proposed changes before merge.
  pull_request: {}

  # Allow maintainers to reproduce startup issues from the Actions tab.
  workflow_dispatch: {}

  # Verify the application after changes reach development.
  push:
    branches:
      - development

# This job reads source and runs a local container without registry credentials.
permissions:
  contents: read

jobs:
  startup:
    name: Build and verify Dragonfly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout application source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the web image
        shell: bash
        run: |
          # Use the existing Dockerfile so this checks the same runtime
          # image definition used by the repository.
          docker build \
            --file .build/www/Dockerfile \
            --tag webpwnized/dragonfly:www \
            .

      - name: Start Dragonfly with the checked-out source
        shell: bash
        run: |
          # The Dockerfile fetches application source during its build.
          # Overlay it with this checkout so PR checks serve the code
          # under review while using the image's web server and startup command.
          test -f "$GITHUB_WORKSPACE/src/index.php"

          docker run --detach \
            --name dragonfly-smoke \
            --publish 127.0.0.1:8888:80 \
            --mount "type=bind,source=$GITHUB_WORKSPACE/src,target=/var/www/dragonfly,readonly" \
            webpwnized/dragonfly:www

      - name: Wait for the Dragonfly home page
        shell: bash
        run: |
          # Docker can report that a container started before its web
          # server accepts requests. Retry transient connection failures
          # and verify that the response is the expected page.
          for attempt in {1..20}; do
            if response=$(curl --fail --silent --show-error --max-time 3 \
                http://127.0.0.1:8888/) &&
                [[ "$response" == *'<title>Dragonfly</title>'* ]]; then
              echo "Dragonfly is ready on port 8888."
              exit 0
            fi

            echo "Readiness attempt $attempt of 20 did not succeed."
            sleep 2
          done

          echo "::error::Dragonfly did not serve the expected home page."
          exit 1

      - name: Show container diagnostics
        if: ${{ failure() }}
        shell: bash
        run: |
          # Show whether the container exited and capture its startup output.
          docker ps --all --filter name=dragonfly-smoke
          if docker container inspect dragonfly-smoke >/dev/null 2>&1; then
            docker logs --tail 100 dragonfly-smoke
          fi

      - name: Remove the smoke-test container
        if: ${{ always() }}
        shell: bash
        run: |
          # Clean up even when the readiness check fails.
          if docker container inspect dragonfly-smoke >/dev/null 2>&1; then
            docker rm --force dragonfly-smoke
          fi